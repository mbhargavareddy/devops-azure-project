<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DevOps Project</title>
  <style>
    body { font-family: Arial, sans-serif; background:#0f172a; color:#e2e8f0;
           display:flex; justify-content:center; align-items:center; height:100vh; margin:0; }
    .card { background:#1e293b; padding:40px 60px; border-radius:12px; text-align:center; }
    .tag { color:#38bdf8; font-weight:bold; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Deployed with Terraform + Jenkins on Azure</h1>
    <p>Environment: <span class="tag">{{ env }}</span></p>
    <p>Version: <span class="tag">{{ version }}</span></p>
  </div>
</body>
</html>
